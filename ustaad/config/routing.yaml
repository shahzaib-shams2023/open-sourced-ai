# USTAAD Agent Model Routing
# Maps each agent role to its preferred Ollama model
#
# Available models per task type:
#   reasoning/planning → deepseek-coder, gemma3:12b
#   coding             → qwen2.5-coder, gemma3:12b
#   review/security    → gemma3:12b
#   fast tasks         → gemma3:4b
#   embeddings         → nomic-embed-text

planner:
  default: gemma3:12b
  trivial: gemma3:12b
  standard: gemma3:12b
  complex: deepseek-r1:32b

coder:
  default: gemma3:12b
  trivial: gemma3:12b
  standard: qwen3:32b
  complex: qwen3:32b

reviewer:
  default: gemma3:12b
  trivial: gemma3:12b
  standard: gemma3:12b
  complex: qwen3:32b

researcher:
  default: mistral:latest
  trivial: mistral:latest
  standard: mistral:latest
  complex: gemma3:12b

security:
  default: gemma3:12b
  trivial: gemma3:12b
  standard: gemma3:12b
  complex: qwen3:32b

devops:
  default: gemma3:12b
  trivial: gemma3:12b
  standard: gemma3:12b
  complex: qwen3:32b

debugger:
  default: gemma3:12b
  trivial: gemma3:12b
  standard: qwen3:32b
  complex: deepseek-r1:32b

shell:
  default: gemma3:12b
  trivial: mistral:latest
  standard: gemma3:12b
  complex: gemma3:12b

# Execution mode defaults
execution:
  safe: true
  autonomous: false
  confirm_destructive: true

# Repair loop settings
repair:
  max_attempts: 5
  auto_run: true

# Context management
context:
  max_chars: 60000
  chunk_size: 60
  chunk_overlap: 10

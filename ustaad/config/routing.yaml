# USTAAD Agent Model Routing
# Maps each agent role to its preferred Ollama model
#
# Available models per task type (Optimized for GTX 1060 6GB / 16GB RAM):
#   reasoning/planning → qwen3:4b-thinking (lightweight reasoning, fully accelerated in VRAM)
#   coding/standard    → cieloforge/qwen2.5-coder-7b-instruct-spec:latest (best hardware-fit all-rounder)
#   review/security    → cieloforge/qwen2.5-coder-7b-instruct-spec:latest
#   fast/trivial tasks → qwen3.6-2k:latest (extremely fast, low memory footprint)
#   embeddings         → nomic-embed-text

planner:
  default: cieloforge/qwen2.5-coder-7b-instruct-spec:latest
  trivial: qwen3.6-2k:latest
  standard: cieloforge/qwen2.5-coder-7b-instruct-spec:latest
  complex: qwen3:4b-thinking

coder:
  default: cieloforge/qwen2.5-coder-7b-instruct-spec:latest
  trivial: qwen3.6-2k:latest
  standard: cieloforge/qwen2.5-coder-7b-instruct-spec:latest
  complex: cieloforge/qwen2.5-coder-7b-instruct-spec:latest

reviewer:
  default: cieloforge/qwen2.5-coder-7b-instruct-spec:latest
  trivial: qwen3.6-2k:latest
  standard: cieloforge/qwen2.5-coder-7b-instruct-spec:latest
  complex: cieloforge/qwen2.5-coder-7b-instruct-spec:latest

researcher:
  default: cieloforge/qwen2.5-coder-7b-instruct-spec:latest
  trivial: qwen3.6-2k:latest
  standard: cieloforge/qwen2.5-coder-7b-instruct-spec:latest
  complex: cieloforge/qwen2.5-coder-7b-instruct-spec:latest

security:
  default: cieloforge/qwen2.5-coder-7b-instruct-spec:latest
  trivial: qwen3.6-2k:latest
  standard: cieloforge/qwen2.5-coder-7b-instruct-spec:latest
  complex: cieloforge/qwen2.5-coder-7b-instruct-spec:latest

devops:
  default: cieloforge/qwen2.5-coder-7b-instruct-spec:latest
  trivial: qwen3.6-2k:latest
  standard: cieloforge/qwen2.5-coder-7b-instruct-spec:latest
  complex: cieloforge/qwen2.5-coder-7b-instruct-spec:latest

debugger:
  default: cieloforge/qwen2.5-coder-7b-instruct-spec:latest
  trivial: qwen3.6-2k:latest
  standard: cieloforge/qwen2.5-coder-7b-instruct-spec:latest
  complex: qwen3:4b-thinking

shell:
  default: cieloforge/qwen2.5-coder-7b-instruct-spec:latest
  trivial: qwen3.6-2k:latest
  standard: cieloforge/qwen2.5-coder-7b-instruct-spec:latest
  complex: cieloforge/qwen2.5-coder-7b-instruct-spec:latest

# Execution mode defaults
execution:
  safe: true
  autonomous: false
  confirm_destructive: true

# Repair loop settings
repair:
  max_attempts: 5
  auto_run: true

# Context management
context:
  max_chars: 60000
  chunk_size: 60
  chunk_overlap: 10
